<!DOCTYPE html>
<html lang="en">
<head>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Play backgammon with an AI tutor, animated pieces, and voice commentary">
  <meta name="theme-color" content="#8B4513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Backgammon">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }
    #root {
      min-height: 100vh;
    }
    /* Button hover and active states */
    button {
      transition: all 0.15s ease;
    }
    button:not(:disabled):hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    button:not(:disabled):active {
      filter: brightness(0.9);
      transform: translateY(1px) scale(0.98);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .training-btn:not(:disabled):active {
      background: rgba(255,255,255,0.15) !important;
      border-color: currentColor !important;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes diceSpin {
      0% { transform: perspective(100px) rotateX(0deg) rotateY(0deg); }
      25% { transform: perspective(100px) rotateX(90deg) rotateY(90deg); }
      50% { transform: perspective(100px) rotateX(180deg) rotateY(180deg); }
      75% { transform: perspective(100px) rotateX(270deg) rotateY(270deg); }
      100% { transform: perspective(100px) rotateX(360deg) rotateY(360deg); }
    }
    @keyframes diceSettle {
      0% { transform: perspective(100px) rotateX(10deg) scale(1.05); }
      60% { transform: perspective(100px) rotateX(-3deg) scale(0.98); }
      100% { transform: perspective(100px) rotateX(5deg) scale(1); }
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes shadowPulse {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }
    @keyframes landingRipple {
      0% { r: 10; opacity: 0.6; stroke-width: 3; }
      100% { r: 40; opacity: 0; stroke-width: 1; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-5px) rotate(-1deg); }
      20% { transform: translateX(5px) rotate(1deg); }
      30% { transform: translateX(-4px) rotate(-0.5deg); }
      40% { transform: translateX(4px) rotate(0.5deg); }
      50% { transform: translateX(-3px); }
      60% { transform: translateX(3px); }
      70% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
      90% { transform: translateX(-1px); }
    }
    @keyframes celebrateGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2) saturate(1.2); }
    }
    .screen-shake {
      animation: screenShake 0.2s ease-out;
    }
    .celebrating {
      animation: celebrateGlow 0.5s ease-in-out infinite;
    }
    /* Hardware acceleration for particles */
    .particles {
      will-change: transform;
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ============================================================================
    // SOUND SYSTEM - Fixed for browser autoplay policies
    // ============================================================================
    
    class SoundSystem {
      constructor() {
        this.audioContext = null;
        this.enabled = true;
        this.initialized = false;
      }
      
      init() {
        try {
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          // Resume context if it was suspended (browser autoplay policy)
          if (this.audioContext && this.audioContext.state === 'suspended') {
            this.audioContext.resume();
          }
          this.initialized = true;
        } catch (e) {
          console.log('Audio init error:', e);
        }
      }
      
      getContext() {
        if (!this.audioContext) {
          this.init();
        }
        if (this.audioContext && this.audioContext.state === 'suspended') {
          this.audioContext.resume();
        }
        return this.audioContext;
      }
      
      playWoodClick(intensity = 1) {
        if (!this.enabled) return;
        const ctx = this.getContext();
        if (!ctx) return;
        
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          
          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(180 * intensity, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
          
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.Q.setValueAtTime(1, now);
          
          gain.gain.setValueAtTime(0.3 * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {
          console.log('Sound error:', e);
        }
      }
      
      playHit() {
        if (!this.enabled) return;
        this.playWoodClick(1.2);
        setTimeout(() => this.playWoodClick(0.8), 50);
      }
      
      playDiceRoll() {
        if (!this.enabled) return;
        const ctx = this.getContext();
        if (!ctx) return;
        
        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            if (!this.enabled) return;
            const context = this.getContext();
            if (!context) return;
            try {
              const osc = context.createOscillator();
              const gain = context.createGain();
              
              osc.connect(gain);
              gain.connect(context.destination);
              
              const now = context.currentTime;
              osc.frequency.setValueAtTime(200 + Math.random() * 300, now);
              osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
              
              gain.gain.setValueAtTime(0.1, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
              
              osc.start(now);
              osc.stop(now + 0.05);
            } catch (e) {}
          }, i * 60 + Math.random() * 30);
        }
      }
      
      playBearOff() {
        if (!this.enabled) return;
        const ctx = this.getContext();
        if (!ctx) return;
        
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
          
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }
      
      playVictory() {
        if (!this.enabled) return;
        const ctx = this.getContext();
        if (!ctx) return;
        
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const delays = [0, 0.15, 0.3, 0.45];
        
        notes.forEach((freq, i) => {
          setTimeout(() => {
            if (!this.enabled) return;
            const context = this.getContext();
            if (!context) return;
            try {
              const osc = context.createOscillator();
              const gain = context.createGain();
              
              osc.connect(gain);
              gain.connect(context.destination);
              
              osc.type = 'triangle';
              const now = context.currentTime;
              osc.frequency.setValueAtTime(freq, now);
              
              gain.gain.setValueAtTime(0.2, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
              
              osc.start(now);
              osc.stop(now + 0.4);
            } catch (e) {}
          }, delays[i] * 1000);
        });
      }
    }
    
    const soundSystem = new SoundSystem();

    // ============================================================================
    // PARTICLE SYSTEM
    // ============================================================================
    
    class Particle {
      constructor(x, y, options = {}) {
        this.x = x;
        this.y = y;
        this.vx = options.vx || (Math.random() - 0.5) * 4;
        this.vy = options.vy || (Math.random() - 0.5) * 4;
        this.life = options.life || 1;
        this.maxLife = this.life;
        this.size = options.size || 4;
        this.color = options.color || '#FFD700';
        this.type = options.type || 'circle'; // circle, star, spark, confetti
        this.gravity = options.gravity || 0;
        this.friction = options.friction || 0.98;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
        this.fadeOut = options.fadeOut !== false;
        this.shrink = options.shrink || false;
        this.glow = options.glow || false;
      }
      
      update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += this.gravity * dt * 60;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.rotation += this.rotationSpeed;
        this.life -= dt;
        return this.life > 0;
      }
      
      getOpacity() {
        if (!this.fadeOut) return 1;
        return Math.max(0, this.life / this.maxLife);
      }
      
      getSize() {
        if (!this.shrink) return this.size;
        return this.size * (this.life / this.maxLife);
      }
    }
    
    class ParticleSystem {
      constructor() {
        this.particles = [];
        this.enabled = true;
        this.ambientParticles = [];
        this.lastAmbientSpawn = 0;
      }
      
      emit(x, y, count, options = {}) {
        if (!this.enabled) return;
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(x, y, {
            ...options,
            vx: options.vx !== undefined ? options.vx + (Math.random() - 0.5) * (options.spread || 2) : (Math.random() - 0.5) * (options.spread || 4),
            vy: options.vy !== undefined ? options.vy + (Math.random() - 0.5) * (options.spread || 2) : (Math.random() - 0.5) * (options.spread || 4),
          }));
        }
      }
      
      // Dust puff when checker lands
      emitDust(x, y, theme) {
        const dustColor = theme === 'classic' ? '#8B7355' : '#4a5568';
        this.emit(x, y, 8, {
          color: dustColor,
          size: 3 + Math.random() * 3,
          life: 0.4 + Math.random() * 0.3,
          vx: 0,
          vy: -1,
          spread: 3,
          gravity: 0.05,
          friction: 0.92,
          type: 'circle',
          shrink: true,
        });
      }
      
      // Sparks when hitting opponent
      emitSparks(x, y, theme) {
        const sparkColors = theme === 'classic' 
          ? ['#FFD700', '#FFA500', '#FF6347', '#FFE4B5']
          : ['#00FFFF', '#FF00FF', '#00FF00', '#FFFF00'];
        
        for (let i = 0; i < 15; i++) {
          const angle = (Math.PI * 2 * i) / 15 + Math.random() * 0.3;
          const speed = 3 + Math.random() * 4;
          this.particles.push(new Particle(x, y, {
            color: sparkColors[Math.floor(Math.random() * sparkColors.length)],
            size: 2 + Math.random() * 3,
            life: 0.5 + Math.random() * 0.4,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.15,
            friction: 0.95,
            type: 'spark',
            glow: true,
          }));
        }
      }
      
      // Golden sparkles for perfect/good moves
      emitSparkles(x, y, rating) {
        const colors = rating === 'Perfect' 
          ? ['#FFD700', '#FFEC8B', '#FFF8DC'] 
          : rating === 'Good'
          ? ['#90EE90', '#98FB98', '#F0FFF0']
          : ['#87CEEB', '#B0E0E6', '#E0FFFF'];
        
        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const speed = 1.5 + Math.random() * 2;
          this.particles.push(new Particle(x, y, {
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 3 + Math.random() * 2,
            life: 0.8 + Math.random() * 0.4,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            gravity: -0.02,
            friction: 0.97,
            type: 'star',
            glow: true,
          }));
        }
      }
      
      // Confetti explosion for winning
      emitConfetti(centerX, centerY, width, height) {
        const confettiColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F'];
        
        for (let i = 0; i < 100; i++) {
          const x = centerX + (Math.random() - 0.5) * width * 0.8;
          const startY = -20;
          this.particles.push(new Particle(x, startY, {
            color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
            size: 6 + Math.random() * 6,
            life: 3 + Math.random() * 2,
            vx: (Math.random() - 0.5) * 3,
            vy: 2 + Math.random() * 3,
            gravity: 0.08,
            friction: 0.99,
            type: 'confetti',
            fadeOut: false,
            rotationSpeed: (Math.random() - 0.5) * 15,
          }));
        }
      }
      
      // Firework burst
      emitFirework(x, y, color) {
        const burstColors = [color, '#FFFFFF', '#FFD700'];
        
        // Inner burst
        for (let i = 0; i < 20; i++) {
          const angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.2;
          const speed = 4 + Math.random() * 3;
          this.particles.push(new Particle(x, y, {
            color: burstColors[Math.floor(Math.random() * burstColors.length)],
            size: 3 + Math.random() * 2,
            life: 0.8 + Math.random() * 0.5,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.12,
            friction: 0.96,
            type: 'circle',
            glow: true,
            shrink: true,
          }));
        }
        
        // Outer sparkle ring
        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const speed = 6 + Math.random() * 2;
          this.particles.push(new Particle(x, y, {
            color: '#FFFFFF',
            size: 2,
            life: 0.4 + Math.random() * 0.2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.05,
            friction: 0.94,
            type: 'spark',
            glow: true,
          }));
        }
      }
      
      // Ambient floating particles
      updateAmbient(width, height, theme, dt) {
        if (!this.enabled) return;
        
        // Spawn new ambient particles occasionally
        this.lastAmbientSpawn += dt;
        if (this.lastAmbientSpawn > 0.3 && this.ambientParticles.length < 15) {
          this.lastAmbientSpawn = 0;
          
          if (theme === 'classic') {
            // Warm dust motes / embers
            this.ambientParticles.push(new Particle(
              Math.random() * width,
              height + 10,
              {
                color: Math.random() > 0.7 ? '#FFA500' : '#D4A574',
                size: 1.5 + Math.random() * 2,
                life: 8 + Math.random() * 4,
                vx: (Math.random() - 0.5) * 0.3,
                vy: -0.3 - Math.random() * 0.4,
                gravity: -0.001,
                friction: 1,
                type: 'circle',
                glow: Math.random() > 0.7,
              }
            ));
          } else {
            // Digital glitch particles
            this.ambientParticles.push(new Particle(
              Math.random() * width,
              Math.random() * height,
              {
                color: Math.random() > 0.5 ? '#00FFFF' : '#FF00FF',
                size: 1 + Math.random() * 2,
                life: 2 + Math.random() * 2,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 0.5,
                gravity: 0,
                friction: 0.99,
                type: Math.random() > 0.5 ? 'spark' : 'circle',
                glow: true,
              }
            ));
          }
        }
        
        // Update ambient particles
        this.ambientParticles = this.ambientParticles.filter(p => p.update(dt));
      }
      
      update(dt) {
        this.particles = this.particles.filter(p => p.update(dt));
      }
      
      getAll() {
        return [...this.particles, ...this.ambientParticles];
      }
      
      clear() {
        this.particles = [];
      }
    }
    
    const particleSystem = new ParticleSystem();

      // ========== IndexedDB for large audio cache ==========
      
      async openCacheDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('BackgammonVoiceCache', 1);
          
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('audioCache')) {
              db.createObjectStore('audioCache', { keyPath: 'key' });
            }
          };
        });
      }
      
      async saveAudioCacheDB() {
        try {
          const db = await this.openCacheDB();
          const tx = db.transaction('audioCache', 'readwrite');
          const store = tx.objectStore('audioCache');
          
          // Clear existing and add all current cache entries
          store.clear();
          for (const [key, value] of this.audioCache.entries()) {
            store.put({ key, value });
          }
          
          await new Promise((resolve, reject) => {
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
          });
          
          console.log(`💾 Saved ${this.audioCache.size} phrases to IndexedDB`);
          db.close();
        } catch (e) {
          console.error('IndexedDB save error:', e);
        }
      }
      
      async loadAudioCacheDB() {
        try {
          const db = await this.openCacheDB();
          const tx = db.transaction('audioCache', 'readonly');
          const store = tx.objectStore('audioCache');
          
          const allItems = await new Promise((resolve, reject) => {
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
          
          for (const item of allItems) {
            this.audioCache.set(item.key, item.value);
          }
          
          console.log(`💾 Loaded ${this.audioCache.size} phrases from IndexedDB`);
          db.close();
        } catch (e) {
          console.log('IndexedDB load error (may be first run):', e);
        }
      }
      
      loadSettings() {
        try {
          const saved = localStorage.getItem('backgammon_voice_settings');
          if (saved) {
            const settings = JSON.parse(saved);
            this.mode = settings.mode || 'browser';
            this.geminiApiKey = settings.apiKey || '';
          }
          
          // Load audio cache from IndexedDB (async, will populate after)
          this.loadAudioCacheDB();
          
          // Also try localStorage as fallback for smaller caches
          const cachedAudio = localStorage.getItem('backgammon_audio_cache');
          if (cachedAudio) {
            try {
              const cacheData = JSON.parse(cachedAudio);
              for (const [key, value] of Object.entries(cacheData)) {
                this.audioCache.set(key, value);
              }
            } catch (e) {}
          }
        } catch (e) {
          console.log('Could not load voice settings');
        }
      }
      
      saveSettings() {
        try {
          localStorage.setItem('backgammon_voice_settings', JSON.stringify({
            mode: this.mode,
            apiKey: this.geminiApiKey
          }));
        } catch (e) {
          console.log('Could not save voice settings');
        }
      }
      
      saveAudioCache() {
        // Save to IndexedDB (handles large caches)
        this.saveAudioCacheDB();
        
        // Also try localStorage as backup for small caches
        try {
          const cacheObj = {};
          for (const [key, value] of this.audioCache.entries()) {
            cacheObj[key] = value;
          }
          const cacheStr = JSON.stringify(cacheObj);
          // Only save to localStorage if under 4MB
          if (cacheStr.length < 4 * 1024 * 1024) {
            localStorage.setItem('backgammon_audio_cache', cacheStr);
          }
        } catch (e) {
          // localStorage full, but IndexedDB should have it
        }
      }

      getAudioContext() {
        if (!this.audioContext) {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return this.audioContext;
      }
      
      // Pre-warm the audio context to reduce playback delay
      // Call this on user interaction (click, etc)
      async warmupAudio() {
        try {
          const ctx = this.getAudioContext();
          if (ctx.state === 'suspended') {
            await ctx.resume();
          }
          // Create a tiny silent buffer to fully initialize the audio pipeline
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start();
          console.log('🔊 Audio context warmed up, state:', ctx.state);
        } catch (e) {
          console.log('Could not warm up audio context:', e);
        }
      }

      // ========== HYBRID MODE ==========
      
      // Helper to normalize text for cache matching (ignore punctuation differences)
      normalizeForCache(text) {
        return text.toLowerCase().trim().replace(/[!?.,:;]+$/, '');
      }
      
      // Find a cache key that matches this text (flexible punctuation matching)
      findCacheKey(text, personality, category) {
        const normalized = this.normalizeForCache(text);
        
        // First try exact match with the incoming text
        const exactKey = `${personality}_${category}_${text.toLowerCase()}`;
        if (this.audioCache.has(exactKey)) {
          return exactKey;
        }
        
        // Search all cache keys for a match (handles punctuation differences)
        for (const key of this.audioCache.keys()) {
          // Key format: personality_category_text
          if (key.startsWith(`${personality}_`)) {
            const keyParts = key.split('_');
            if (keyParts.length >= 3) {
              const keyText = keyParts.slice(2).join('_'); // Rejoin in case text had underscores
              const keyNormalized = this.normalizeForCache(keyText);
              if (keyNormalized === normalized) {
                return key;
              }
            }
          }
        }
        
        // Also try matching with any category (in case category was different)
        for (const key of this.audioCache.keys()) {
          if (key.startsWith(`${personality}_`)) {
            const keyParts = key.split('_');
            if (keyParts.length >= 3) {
              const keyText = keyParts.slice(2).join('_');
              const keyNormalized = this.normalizeForCache(keyText);
              if (keyNormalized === normalized) {
                return key;
              }
            }
          }
        }
        
        return null;
      }
      
      async speakHybrid(text, personality, category) {

        // Check if this matches a phrase we SHOULD cache
        const normalizedText = this.normalizeForCache(text);
        const matchedPhrase = this.commonPhrases.find(p =>

        );
        
        // If we have API key and it's a common phrase, generate and cache
        if (matchedPhrase && this.geminiApiKey) {

                },

                      }
                    }

                })
              }
            );
            
            if (response.ok) {

              if (audioBase64) {
                const cacheKey = `${personality}_${matchedPhrase.category}_${matchedPhrase.text.toLowerCase()}`;
                console.log('⚡ HYBRID: Successfully cached phrase:', matchedPhrase.text);

        } else {
          console.log('⚡ HYBRID: Non-cached phrase, using browser TTS:', text.substring(0, 40));
        }
        
        // Fall back to browser TTS
        this.speakBrowser(text, personality);

      // Pre-cache common phrases in background with proper rate limiting
      async preCacheCommonPhrases(personality, progressCallback, statusCallback, essentialOnly = false) {
        if (!this.geminiApiKey) {
          console.log('No API key for pre-caching');
          return { completed: 0, failed: 0, rateLimited: false };
        }
        
        // Allow cancellation
        this.cachingInProgress = true;
        this.cancelCaching = false;
        
        // Use essential phrases only if specified, otherwise all common phrases
        const sourceList = essentialOnly ? this.essentialPhrases : this.commonPhrases;
        const phrasesToCache = sourceList.filter(p => {
          const cacheKey = `${personality}_${p.category}_${p.text.toLowerCase()}`;
          return !this.audioCache.has(cacheKey);
        });
        
        let completed = 0;
        let failed = 0;
        let consecutiveErrors = 0;
        let baseDelay = 3000; // Start with 3 second delay between calls
        
        console.log(`📦 Starting cache: ${phrasesToCache.length} phrases to cache (essential only: ${essentialOnly})`);
        
        for (const phrase of phrasesToCache) {
          // Check for cancellation
          if (this.cancelCaching) {
            console.log('📦 Caching cancelled by user');
            if (statusCallback) statusCallback('Cancelled');
            break;
          }
          
          try {
            const cacheKey = `${personality}_${phrase.category}_${phrase.text.toLowerCase()}`;
            const voice = this.geminiVoices[personality] || 'Charon';
            const stylePrompt = this.stylePrompts[phrase.category]?.[personality] || 
                               this.stylePrompts.neutral[personality];
            
            const fullPrompt = `${stylePrompt} "${phrase.text}"`;
            
            if (statusCallback) statusCallback(`Caching: "${phrase.text.substring(0, 20)}..."`);
            
            const response = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': this.geminiApiKey
                },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: fullPrompt }] }],
                  generationConfig: {
                    responseModalities: ['AUDIO'],
                    speechConfig: {
                      voiceConfig: {
                        prebuiltVoiceConfig: { voiceName: voice }
                      }
                    }
                  }
                })
              }
            );
            
            if (response.status === 429) {
              // Rate limited - exponential backoff
              consecutiveErrors++;
              const backoffDelay = baseDelay * Math.pow(2, Math.min(consecutiveErrors, 5)); // Max 96 seconds
              console.log(`⚠️ Rate limited! Waiting ${backoffDelay/1000}s before retry...`);
              if (statusCallback) statusCallback(`Rate limited - waiting ${Math.round(backoffDelay/1000)}s...`);
              await new Promise(resolve => setTimeout(resolve, backoffDelay));
              // Don't count this as failed, will retry on next iteration
              continue;
            }
            
            if (response.ok) {
              const data = await response.json();
              const audioBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
              if (audioBase64) {
                this.audioCache.set(cacheKey, audioBase64);
                // Save after each successful cache to preserve progress
                this.saveAudioCache();
                consecutiveErrors = 0; // Reset error counter on success
                console.log(`✅ Cached: "${phrase.text}"`);
              }
              completed++;
            } else {
              const errorText = await response.text();
              console.error(`❌ API error ${response.status}:`, errorText);
              failed++;
              consecutiveErrors++;
            }
            
            if (progressCallback) {
              progressCallback(completed, phrasesToCache.length, failed);
            }
            
            // Adaptive delay - slower if we've had errors
            const delay = baseDelay + (consecutiveErrors * 2000);
            if (statusCallback && delay > baseDelay) {
              statusCallback(`Slowing down due to errors... (${delay/1000}s delay)`);
            }
            await new Promise(resolve => setTimeout(resolve, delay));
            
          } catch (error) {
            console.error('Error caching phrase:', phrase.text, error);
            failed++;
            consecutiveErrors++;
            
            // If too many consecutive errors, stop
            if (consecutiveErrors >= 5) {
              console.error('📦 Too many consecutive errors, stopping cache');
              if (statusCallback) statusCallback('Stopped: Too many errors');
              break;
            }
          }
        }
        
        this.cachingInProgress = false;
        this.saveAudioCache();
        
        console.log(`📦 Caching complete: ${completed} succeeded, ${failed} failed`);
        return { completed, failed, rateLimited: consecutiveErrors >= 3 };
      }

      // ========== AUDIO PLAYBACK ==========
      
      async playPCMAudio(base64Data) {
        console.log('🔊 playPCMAudio called, data length:', base64Data.length);
        try {
          const ctx = this.getAudioContext();
          console.log('🔊 AudioContext state:', ctx.state);
          
          // Resume context if suspended (browser autoplay policy)
          if (ctx.state === 'suspended') {
            console.log('🔊 Resuming suspended AudioContext...');
            await ctx.resume();
          }
          
          // Decode base64 to binary
          const binaryString = atob(base64Data);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          console.log('🔊 Decoded bytes:', bytes.length);
          
          // Convert PCM s16le to Float32 for Web Audio API
          // Gemini returns 24000 Hz, 16-bit, mono PCM
          const samples = bytes.length / 2;
          const audioBuffer = ctx.createBuffer(1, samples, 24000);
          const channelData = audioBuffer.getChannelData(0);
          
          const dataView = new DataView(bytes.buffer);
          for (let i = 0; i < samples; i++) {
            // Read as signed 16-bit little-endian, normalize to [-1, 1]
            const sample = dataView.getInt16(i * 2, true);
            channelData[i] = sample / 32768;
          }
          console.log('🔊 Audio buffer created, samples:', samples, 'duration:', samples/24000, 'seconds');
          
          // Play the audio
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(ctx.destination);
          
          console.log('🔊 Starting playback...');
          return new Promise(resolve => {
            source.onended = () => {
              console.log('🔊 Playback finished');
              resolve();
            };
            source.start();
          });
        } catch (error) {
          console.error('Audio playback error:', error);
        }
      }

      // Import cache from a JSON file
      async importCache(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          
          reader.onload = (e) => {
            try {
              const importData = JSON.parse(e.target.result);
              
              // Validate format
              if (!importData.cache || typeof importData.cache !== 'object') {
                reject(new Error('Invalid cache file format'));
                return;
              }
              
              // Merge with existing cache (imported phrases override existing)
              let importedCount = 0;
              for (const [key, value] of Object.entries(importData.cache)) {
                this.audioCache.set(key, value);
                importedCount++;
              }
              
              // Save to localStorage
              this.saveAudioCache();
              
              console.log(`📦 Imported ${importedCount} cached phrases`);
              resolve({
                imported: importedCount,
                total: this.audioCache.size,
                exportDate: importData.exportDate
              });
            } catch (error) {
              reject(new Error('Failed to parse cache file: ' + error.message));
            }
          };
          
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsText(file);
        });
      }
      
      // Get list of ALL cached phrases (not just those matching commonPhrases)
      getCachedPhrasesList(personality) {
        const cached = [];
        for (const [key, value] of this.audioCache.entries()) {
          // Key format: personality_category_text
          if (key.startsWith(`${personality}_`)) {
            const parts = key.split('_');
            if (parts.length >= 3) {
              const category = parts[1];
              const text = parts.slice(2).join('_'); // Rejoin in case text had underscores
              cached.push({
                text: text,
                category: category,
                cacheKey: key
              });
            }
          }
        }
        return cached;
      }

      getVoiceGender(voice) {
        const name = voice.name.toLowerCase();
        
        // First check for explicit gender indicators in name
        if (name.includes('female') || name.includes('woman') || name.includes('feminine')) {
          return 'female';
        }
        if (name.includes(' male') || name.includes('(male)') || name.includes('masculine')) {
          return 'male';
        }
        
        // Check against female patterns first (they tend to be more distinctive)
        for (const pattern of this.femaleVoicePatterns) {
          // Use word boundary matching for short names to avoid false positives
          if (pattern.length <= 4) {
            // For short patterns, check if it's a distinct word
            const regex = new RegExp(`\\b${pattern}\\b`, 'i');
            if (regex.test(name)) return 'female';
          } else if (name.includes(pattern)) {
            return 'female';
          }
        }
        
        // Check against male patterns
        for (const pattern of this.maleVoicePatterns) {
          if (pattern.length <= 4) {
            const regex = new RegExp(`\\b${pattern}\\b`, 'i');
            if (regex.test(name)) return 'male';
          } else if (name.includes(pattern)) {
            return 'male';
          }
        }
        
        // Platform-specific heuristics
        // macOS: voices ending in "compact" or with parenthetical locale are often female by default
        // Edge/Chrome: Google voices without gender marker tend to be female
        if (name.includes('google') && !name.includes('male')) {
          return 'female'; // Google's default English voices are typically female
        }
        
        return 'unknown';

          return 'uk';
        }
        if (lang.includes('en-au') || lang.includes('en_au') ||

          return 'au';
        }
        if (lang.includes('en-in') || lang.includes('en_in') ||

        if (lang.includes('en-ie') || name.includes('irish') || name.includes('ireland')) {

        }

            this.getVoiceAccent(v) === this.voiceAccent

          if (accentFiltered.length > 0) candidates = accentFiltered;

        // Filter by gender if specified
        if (this.voiceGender !== 'any') {

    const getValidMoves = (board, bar, borneOff, currentPlayer, dice, usedDice) => {
      const moves = [];
      const availableDice = dice.filter((_, i) => !usedDice.includes(i));
      
      if (availableDice.length === 0) return moves;

      const playerBar = bar[currentPlayer];

      const allInHome = () => {
        if (bar[currentPlayer] > 0) return false;
        for (let i = 0; i < 24; i++) {
          if (board[i].player === currentPlayer) {
            if (currentPlayer === 1 && i < 18) return false;
            if (currentPlayer === 2 && i > 5) return false;
          }
        }
        return true;
      };

      const canBearOff = allInHome();

      if (playerBar > 0) {
        availableDice.forEach((die, idx) => {
          const targetPoint = currentPlayer === 1 ? die - 1 : 24 - die;
          if (targetPoint >= 0 && targetPoint < 24) {
            const target = board[targetPoint];
            if (target.player === null || target.player === currentPlayer || target.count === 1) {
              const dieIndex = dice.findIndex((d, i) => d === die && !usedDice.includes(i) && !moves.some(m => m.dieIndex === i && m.from === 'bar' && m.to === targetPoint));
              if (dieIndex !== -1) {
                moves.push({ from: 'bar', to: targetPoint, dieIndex, die, isHit: target.player !== null && target.player !== currentPlayer });
              }
            }
          }
        });
        return moves;
      }

        if (board[i].player === currentPlayer && board[i].count > 0) {
          availableDice.forEach((die) => {
            const targetPoint = currentPlayer === 1 ? i + die : i - die;
            
            if (canBearOff) {

      }
      
      // Prime analysis
      let maxPrime = 0;
      let primeLen = 0;
      let primeStart = -1;
      for (let i = 0; i < 24; i++) {
        if (board[i].player === player && board[i].count >= 2) {
          if (primeLen === 0) primeStart = i;
          primeLen++;
          if (primeLen > maxPrime) {
            maxPrime = primeLen;
          }
        } else {
          primeLen = 0;
        }
      }
      
      if (maxPrime >= 4) {
        analysis.strengths.push(maxPrime + "-point prime! Opponent's checkers are trapped.");
        if (maxPrime === 5) {
          analysis.priorities.push("Extend to a 6-prime for complete lockdown!");
        }
      } else if (maxPrime === 3) {
        analysis.priorities.push("3-point prime formed - try to extend it!");
      }
      
      // Anchor analysis
      const anchorRange = player === 1 ? [0, 5] : [18, 23];
      let anchors = [];
      for (let i = anchorRange[0]; i <= anchorRange[1]; i++) {
        if (board[i].player === player && board[i].count >= 2) {
          const pointNum = player === 1 ? 24 - i : i + 1;
          anchors.push(pointNum);
        }
      }
      
      if (anchors.length > 0) {
        analysis.strengths.push("Anchor on point " + anchors.join(", "));
      } else {
        analysis.weaknesses.push("No anchor in opponent's home board");
      }
      
      return analysis;
    };

    const getAllMoveCombinations = (board, bar, borneOff, player, dice) => {
      const combinations = [];
      
      const explore = (currentBoard, currentBar, currentBorneOff, usedDice, moveSequence) => {
        const moves = getValidMoves(currentBoard, currentBar, currentBorneOff, player, dice, usedDice);
        
        if (moves.length === 0 || usedDice.length === dice.length) {
          if (moveSequence.length > 0) {
            combinations.push({
              moves: [...moveSequence],
              finalBoard: currentBoard,
              finalBar: currentBar,
              finalBorneOff: currentBorneOff,
              diceUsed: usedDice.length
            });
          }
          return;
        }

        const seenMoves = new Set();
        moves.forEach(move => {
          const moveKey = `${move.from}-${move.to}-${move.dieIndex}`;
          if (seenMoves.has(moveKey)) return;
          seenMoves.add(moveKey);

          const result = applyMove(currentBoard, currentBar, currentBorneOff, move, player);
          explore(
            result.board,
            result.bar,
            result.borneOff,
            [...usedDice, move.dieIndex],
            [...moveSequence, move]
          );
        });
      };

      explore(board, bar, borneOff, [], []);
      
      if (combinations.length === 0) {
        combinations.push({
          moves: [],
          finalBoard: board,
          finalBar: bar,
          finalBorneOff: borneOff,
          diceUsed: 0
        });
      }

      return combinations;
    };

    const getBestMove = (board, bar, borneOff, player, dice, difficulty) => {
      const combinations = getAllMoveCombinations(board, bar, borneOff, player, dice);
      
      if (combinations.length === 0) return [];

      const maxDiceUsed = Math.max(...combinations.map(c => c.diceUsed));
      const validCombinations = combinations.filter(c => c.diceUsed === maxDiceUsed);

      if (difficulty === 1) {
        return validCombinations[Math.floor(Math.random() * validCombinations.length)].moves;
      }

      let bestScore = -Infinity;
      let bestMoves = [];

      validCombinations.forEach(combo => {
        let score = evaluatePosition(combo.finalBoard, combo.finalBar, combo.finalBorneOff, player, difficulty);
        
        if (difficulty === 2) {
          score += (Math.random() - 0.5) * 10;
        }

        if (score > bestScore) {
          bestScore = score;
          bestMoves = combo.moves;
        }
      });

      return bestMoves;
    };

    const getOpeningAdvice = (dice) => {
      const key1 = `${Math.max(...dice)}-${Math.min(...dice)}`;
      const key2 = `${dice[0]}-${dice[1]}`;
      return OPENING_MOVES[key1] || OPENING_MOVES[key2] || null;
    };

    const analyzeMove = (board, bar, borneOff, player, dice, playerMoves) => {
      const bestMoves = getBestMove(board, bar, borneOff, player, dice, 3);
      
      let playerBoard = cloneBoard(board);
      let playerBar = { ...bar };
      let playerBorneOff = { ...borneOff };
      
      playerMoves.forEach(move => {
        const result = applyMove(playerBoard, playerBar, playerBorneOff, move, player);
        playerBoard = result.board;
        playerBar = result.bar;
        playerBorneOff = result.borneOff;
      });

      let optimalBoard = cloneBoard(board);
      let optimalBar = { ...bar };
      let optimalBorneOff = { ...borneOff };
      
      bestMoves.forEach(move => {
        const result = applyMove(optimalBoard, optimalBar, optimalBorneOff, move, player);
        optimalBoard = result.board;
        optimalBar = result.bar;
        optimalBorneOff = result.borneOff;
      });

      const playerScore = evaluatePosition(playerBoard, playerBar, playerBorneOff, player, 3);
      const optimalScore = evaluatePosition(optimalBoard, optimalBar, optimalBorneOff, player, 3);
      
      const equity = optimalScore - playerScore;
      
      // Generate detailed move explanations
      const moveExplanations = playerMoves.map(move => explainMove(move, board, bar, player));
      const bestMoveExplanations = bestMoves.map(move => explainMove(move, board, bar, player));
      
      // Determine what made the optimal move better
      const improvements = [];
      
      // Compare hits
      const playerHits = playerMoves.filter(m => board[m.to]?.player === (player === 1 ? 2 : 1) && board[m.to]?.count === 1).length;
      const optimalHits = bestMoves.filter(m => board[m.to]?.player === (player === 1 ? 2 : 1) && board[m.to]?.count === 1).length;
      if (optimalHits > playerHits) {
        improvements.push("The best move hits " + (optimalHits - playerHits) + " more blot(s)");
      }
      
      // Compare points made
      const pointsMade = (moves, b) => {
        let count = 0;
        let tempBoard = cloneBoard(b);
        for (const move of moves) {
          if (tempBoard[move.to]?.player === player && tempBoard[move.to]?.count === 1) {
            count++;
          }
          const result = applyMove(tempBoard, bar, borneOff, move, player);
          tempBoard = result.board;
        }
        return count;
      };
      
      const playerPointsMade = pointsMade(playerMoves, board);
      const optimalPointsMade = pointsMade(bestMoves, board);
      if (optimalPointsMade > playerPointsMade) {
        improvements.push("The best move makes " + (optimalPointsMade - playerPointsMade) + " more point(s)");
      }
      
      // Check for key point differences
      const goldenPoint = player === 1 ? 19 : 4;
      const barPoint = player === 1 ? 17 : 6;
      
      const optimalMakesGolden = bestMoves.some(m => m.to === goldenPoint && board[goldenPoint]?.player === player && board[goldenPoint]?.count === 1);
      const playerMakesGolden = playerMoves.some(m => m.to === goldenPoint && board[goldenPoint]?.player === player && board[goldenPoint]?.count === 1);
      
      if (optimalMakesGolden && !playerMakesGolden) {
        improvements.push("The best move makes the GOLDEN POINT (5-point)!");
      }
      
      // Blot exposure comparison
      let playerBlots = 0, optimalBlots = 0;
      for (let i = 0; i < 24; i++) {
        if (playerBoard[i].player === player && playerBoard[i].count === 1) playerBlots++;
        if (optimalBoard[i].player === player && optimalBoard[i].count === 1) optimalBlots++;
      }
      if (playerBlots > optimalBlots + 1) {
        improvements.push("Your move leaves " + (playerBlots - optimalBlots) + " more exposed blot(s)");
      }
      
      let rating = 'Perfect';
      let explanation = 'Excellent move! This matches or nearly matches the optimal play.';
      let teachingTip = '';
      
      if (equity > 50) {
        rating = 'Blunder';
        explanation = 'This move significantly weakens your position.';
        teachingTip = 'Key concept: ' + (improvements[0] || 'Consider safety and point-making in all moves.');
      } else if (equity > 25) {
        rating = 'Mistake';
        explanation = 'A suboptimal choice that hurts your position.';
        teachingTip = improvements[0] || 'Look for opportunities to make points or hit safely.';
      } else if (equity > 10) {
        rating = 'Inaccuracy';
        explanation = 'A minor error. A better option exists.';
        teachingTip = improvements[0] || 'Small improvements compound over a game.';
      } else if (equity > 3) {
        rating = 'Good';
        explanation = 'A reasonable move. Very close to optimal!';
        teachingTip = improvements[0] || 'Fine play! Keep it up.';
      }

      return { 
        rating, 
        explanation, 
        equity: equity.toFixed(1), 
        bestMoves, 
        playerMoves,
        moveExplanations,
        bestMoveExplanations,
        improvements,
        teachingTip
      };
    };

        });

        tips.push({
          type: 'info',
          text: '🏠 BEARING OFF: Minimize wastage. Move checkers from higher points when possible.',
          category: 'phase'
        });
      } else if (analysis.phase === 'RACE') {
        tips.push({
          type: 'info',
          text: '🏃 RACING: No contact! Pure pip count matters. Move efficiently to minimize wastage.',
          category: 'phase'
        });
      }
      
      // Pip count analysis
      if (analysis.pipCount.diff > 30) {
        tips.push({ 
          type: 'advantage', 
          text: `You're leading by ${analysis.pipCount.diff} pips. Disengage and race if safe!`,
          category: 'race'
        });
      } else if (analysis.pipCount.diff < -30) {
        tips.push({ 
          type: 'warning', 
          text: `You're trailing by ${Math.abs(analysis.pipCount.diff)} pips. You need to hit to catch up!`,
          category: 'race'
        });
      }
      
      // Bar situation
      if (bar[player] > 0) {
        tips.push({ 
          type: 'critical', 
          text: `You have ${bar[player]} checker(s) on the bar. Re-entering is mandatory!`,
          category: 'bar'
        });
      }
      if (bar[opponent] > 0) {
        tips.push({ 
          type: 'advantage', 
          text: `Opponent on bar! Build your home board to keep them trapped.`,
          category: 'bar'
        });
      }
      
      // Blot warnings
      let blotCount = 0;
      let dangerousBlots = [];
      for (let i = 0; i < 24; i++) {
        if (board[i].player === player && board[i].count === 1) {
          blotCount++;
          const danger = calculateBlotDanger(board, i, opponent);
          if (danger > 25) {
            const pointNum = player === 1 ? 24 - i : i + 1;
            dangerousBlots.push({ point: pointNum, danger: danger.toFixed(0) });
          }
        }
      }
      
      if (dangerousBlots.length > 0) {
        const worstBlot = dangerousBlots.sort((a, b) => b.danger - a.danger)[0];
        tips.push({ 
          type: 'warning', 
          text: `⚠️ Exposed blot on point ${worstBlot.point} (${worstBlot.danger}% hit chance). Consider covering it.`,

        });

        tips.push({ 
          type: 'warning', 
          text: `Multiple blots exposed (${blotCount}). Consolidate when possible.`,
          category: 'blots'
        });
      }
      
      // Home board strength
      let homePoints = 0;
      for (let i = (player === 1 ? 18 : 0); i < (player === 1 ? 24 : 6); i++) {
        if (board[i].player === player && board[i].count >= 2) {
          homePoints++;
        }
      }
      
      if (homePoints >= 5) {
        tips.push({ 
          type: 'advantage', 
          text: '🏆 5-point home board! Excellent blocking power. Look for hits!',
          category: 'home'
        });
      } else if (homePoints === 4) {

          type: 'advantage', 
          text: 'Strong 4-point home board. One more point = powerful trap!',
          category: 'home'
        });
      } else if (homePoints <= 1 && analysis.phase !== 'OPENING') {
        tips.push({ 
          type: 'tip', 
          text: 'Weak home board. Hits are less effective until you build more points.',
          category: 'home'
        });
      }
      
      // Key point advice
      const goldenPoint = player === 1 ? 19 : 4;
      const barPoint = player === 1 ? 17 : 6;
      
      if (!(board[goldenPoint]?.player === player && board[goldenPoint]?.count >= 2)) {
        tips.push({ 
          type: 'tip', 
          text: '⭐ The 5-point (Golden Point) is still open. Prioritize making it!',
          category: 'points'
        });
      }
      
      // Prime detection
      let primeLen = 0, maxPrime = 0;
      for (let i = 0; i < 24; i++) {
        if (board[i].player === player && board[i].count >= 2) {
          primeLen++;
          maxPrime = Math.max(maxPrime, primeLen);
        } else {
          primeLen = 0;
        }
      }
      
      if (maxPrime === 6) {
        tips.push({ 
          type: 'advantage', 
          text: '🔒 SIX-POINT PRIME! Perfect! Opponent cannot escape!',
          category: 'prime'
        });
      } else if (maxPrime === 5) {
        tips.push({ 
          type: 'advantage', 
          text: '5-point prime! Extend to 6 for complete lockdown!',
          category: 'prime'
        });
      } else if (maxPrime === 4) {
        tips.push({ 
          type: 'tip', 
          text: '4-point prime forming. Great blocking position!',
          category: 'prime'
        });
      }
      
      // Timing concept
      if (analysis.gameType.type === 'HOLDING' || analysis.gameType.type === 'BACK_GAME') {
        tips.push({
          type: 'tip',
          text: '⏱️ Timing is crucial. Don\'t crash your anchor too early!',
          category: 'timing'
        });
      }
      
      return tips;
    };

    // Calculate Elo change
    const calculateEloChange = (playerElo, puzzleDifficulty, solved) => {
      const expected = 1 / (1 + Math.pow(10, (puzzleDifficulty - playerElo) / 400));
      const actual = solved ? 1 : 0;
      const k = playerElo < 1200 ? 40 : (playerElo < 1500 ? 30 : 20);
      return Math.round(k * (actual - expected));
    };

    const getAdaptiveDifficulty = (progress) => {
      // Calculate recent performance
      const recentAccuracy = progress.accuracyHistory.slice(-5);
      const avgAccuracy = recentAccuracy.length > 0 
        ? recentAccuracy.reduce((a, b) => a + b, 0) / recentAccuracy.length 
        : 50;
      
      // Adjust based on win rate
      const winRate = progress.gamesPlayed > 0 
        ? (progress.gamesWon / progress.gamesPlayed) * 100 
        : 50;
      
      // Combine factors
      const performanceScore = (avgAccuracy * 0.6) + (winRate * 0.4);
      
      if (performanceScore >= 75) return 3; // Hard
      if (performanceScore >= 50) return 2; // Medium
      return 1; // Easy
    };

    const getWeaknessAnalysis = (progress) => {
      const weaknesses = [];
      const breakdown = progress.moveBreakdown;
      const total = Object.values(breakdown).reduce((a, b) => a + b, 0);
      
      if (total < 20) return ['Play more games to identify weaknesses'];
      
      const blunderRate = (breakdown.blunder / total) * 100;
      const mistakeRate = (breakdown.mistake / total) * 100;
      
      if (blunderRate > 10) weaknesses.push('High blunder rate - focus on avoiding risky plays');
      if (mistakeRate > 20) weaknesses.push('Frequent mistakes - take more time to consider options');
      
      // Theme-based weaknesses from puzzles
      if (progress.weaknesses.opening > 2) weaknesses.push('Opening theory needs work - practice opening drills');
      if (progress.weaknesses.hitting > 2) weaknesses.push('Hitting decisions - not all hits are good!');
      if (progress.weaknesses.safety > 2) weaknesses.push('Blot exposure - learn when it\'s safe to leave blots');
      if (progress.weaknesses.priming > 2) weaknesses.push('Prime building - practice extending primes');
      if (progress.weaknesses.bearoff > 2) weaknesses.push('Bear-off technique - minimize wastage');
      
      return weaknesses.length > 0 ? weaknesses : ['Great job! Keep practicing to maintain your edge.'];

    const create3DBoard = (container, board, bar, theme, onReady) => {
      if (!window.THREE) {
        console.log('Three.js not loaded');
        return null;
      }
      
      const width = container.clientWidth || 600;
      const height = 400;
      
      // Scene setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(theme === 'modern' ? 0x1a1a2e : 0x2d1810);
      
      // Camera
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 8, 10);
      camera.lookAt(0, 0, 0);
      
      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);
      
      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);
      
      const pointLight = new THREE.PointLight(theme === 'modern' ? 0x00ffff : 0xffaa00, 0.5);
      pointLight.position.set(0, 5, 0);
      scene.add(pointLight);
      
      // Board base
      const boardGeometry = new THREE.BoxGeometry(12, 0.3, 6);
      const boardMaterial = new THREE.MeshStandardMaterial({ 
        color: theme === 'modern' ? 0x16213e : 0x4a3728,
        roughness: 0.8
      });
      const boardMesh = new THREE.Mesh(boardGeometry, boardMaterial);
      boardMesh.receiveShadow = true;
      scene.add(boardMesh);
      
      // Board frame
      const frameGeometry = new THREE.BoxGeometry(12.4, 0.5, 6.4);
      const frameMaterial = new THREE.MeshStandardMaterial({ 
        color: theme === 'modern' ? 0x0f3460 : 0x2d1810,
        roughness: 0.6
      });
      const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
      frameMesh.position.y = -0.1;
      scene.add(frameMesh);
      
      // Create triangular points
      const pointColors = theme === 'modern' 
        ? [0x1a1a2e, 0x16213e] 
        : [0x8b4513, 0xdaa520];
      
      for (let i = 0; i < 24; i++) {
        const isTop = i < 12;
        const col = isTop ? 11 - i : i - 12;
        const x = (col - 5.5) * 0.9 + (col >= 6 ? 0.6 : 0);
        const z = isTop ? -2 : 2;
        
        const shape = new THREE.Shape();
        shape.moveTo(-0.4, 0);
        shape.lineTo(0.4, 0);
        shape.lineTo(0, isTop ? 2 : -2);
        shape.lineTo(-0.4, 0);
        
        const extrudeSettings = { depth: 0.05, bevelEnabled: false };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        const material = new THREE.MeshStandardMaterial({ 
          color: pointColors[i % 2],
          roughness: 0.7
        });
        const point = new THREE.Mesh(geometry, material);
        point.rotation.x = -Math.PI / 2;
        point.position.set(x, 0.16, z);
        scene.add(point);
      }
      
      // Bar (center divider)
      const barGeometry = new THREE.BoxGeometry(0.5, 0.4, 6);
      const barMaterial = new THREE.MeshStandardMaterial({ 
        color: theme === 'modern' ? 0x0f3460 : 0x2d1810,
        roughness: 0.6
      });
      const barMesh = new THREE.Mesh(barGeometry, barMaterial);
      barMesh.position.y = 0.05;
      scene.add(barMesh);
      
      // Checkers
      const checkerGroups = { 1: [], 2: [] };
      const checkerGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.15, 32);
      
      const createChecker = (player, x, y, z) => {
        const material = new THREE.MeshStandardMaterial({ 
          color: player === 1 
            ? (theme === 'modern' ? 0x00ffff : 0xf5f5dc)
            : (theme === 'modern' ? 0xff6b6b : 0x1a1a1a),
          roughness: 0.3,
          metalness: 0.2
        });
        const checker = new THREE.Mesh(checkerGeometry, material);
        checker.position.set(x, y, z);
        checker.castShadow = true;
        scene.add(checker);
        checkerGroups[player].push(checker);
        return checker;
      };
      
      // Place checkers based on board state
      const updateCheckers = (newBoard, newBar) => {
        // Remove existing checkers
        checkerGroups[1].forEach(c => scene.remove(c));
        checkerGroups[2].forEach(c => scene.remove(c));
        checkerGroups[1] = [];
        checkerGroups[2] = [];
        
        // Place new checkers
        for (let i = 0; i < 24; i++) {
          const point = newBoard[i];
          if (point.count > 0) {
            const isTop = i < 12;
            const col = isTop ? 11 - i : i - 12;
            const x = (col - 5.5) * 0.9 + (col >= 6 ? 0.6 : 0);
            const baseZ = isTop ? -2.2 : 2.2;
            
            for (let j = 0; j < Math.min(point.count, 5); j++) {
              const z = baseZ + (isTop ? 1 : -1) * j * 0.35;
              createChecker(point.player, x, 0.25 + j * 0.16, z);
            }
            
            // Stack indicator for > 5
            if (point.count > 5) {
              // Add number indicator (simplified)
            }
          }
        }
        
        // Bar checkers
        for (let j = 0; j < newBar[1]; j++) {
          createChecker(1, 0, 0.25 + j * 0.16, -1 - j * 0.3);
        }
        for (let j = 0; j < newBar[2]; j++) {
          createChecker(2, 0, 0.25 + j * 0.16, 1 + j * 0.3);
        }
      };
      
      updateCheckers(board, bar);
      
      // Animation
      let rotationY = 0;
      const animate = () => {
        requestAnimationFrame(animate);
        
        // Subtle camera sway
        rotationY += 0.002;
        camera.position.x = Math.sin(rotationY) * 0.5;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      };
      animate();
      
      // Return controls
      return {
        updateBoard: updateCheckers,
        setRotation: (angle) => {
          camera.position.x = Math.sin(angle) * 10;
          camera.position.z = Math.cos(angle) * 10;
          camera.lookAt(0, 0, 0);
        },
        dispose: () => {
          renderer.dispose();
          container.removeChild(renderer.domElement);
        }
      };
    };
