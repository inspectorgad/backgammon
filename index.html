          await animateMove(move, currentBoard, currentBar, currentBorneOff, 2);
          
          const result = applyMove(currentBoard, currentBar, currentBorneOff, move, 2);
          currentBoard = result.board;
          currentBar = result.bar;
          currentBorneOff = result.borneOff;
          currentUsedDice.push(move.dieIndex);
          
          setBoard(currentBoard);
          setBar(currentBar);
          setBorneOff(currentBorneOff);
          setUsedDice([...currentUsedDice]);
          
          // Small delay between moves
          await new Promise(resolve => setTimeout(resolve, 300));
        }

        setMoveHistory(prev => [...prev, {
          player: 2,
          dice: [...dice],
          moves: moves,
          board: cloneBoard(currentBoard),
          analysis: null
        }]);

        setDice([]);
        setUsedDice([]);
        setDiceOnBoard([]); // Clear dice from board
        setCurrentPlayer(1);
        setIsAnimating(false);
      };

      const animateMove = (move, currentBoard, currentBar, currentBorneOff, player) => {
        return new Promise((resolve) => {
          // Calculate start position
          let startX, startY;
          if (move.from === 'bar') {
            startX = getBarX();
            startY = getBarY(player, Math.max(0, currentBar[player] - 1));
          } else {
            startX = getPointX(move.from);
            startY = getCheckerY(move.from, Math.max(0, currentBoard[move.from].count - 1), currentBoard[move.from].count);
          }

          // Calculate end position
          let endX, endY;
          if (move.to === 'off') {
            const homePos = getHomePosition(player);
            endX = homePos.x;
            endY = homePos.y;
          } else {
            endX = getPointX(move.to);
            const targetCount = currentBoard[move.to].player === player ? currentBoard[move.to].count : 0;
            endY = getCheckerY(move.to, targetCount, targetCount + 1);
          }

          // Fixed duration for consistent feel
          const duration = 400;

          // Start the animation
          setAnimatingPiece({
            player,
            startX,
            startY,
            endX,
            endY,
            progress: 0,
          });

          // If this is a hit, set up hit animation to start when main animation ends
          const isHit = move.isHit;
          const opponent = player === 1 ? 2 : 1;
          const hitEndY = isHit ? getBarY(opponent, currentBar[opponent]) : 0;

          let startTime = null;

          const animate = (timestamp) => {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const rawProgress = Math.min(elapsed / duration, 1);
            
            // Simple ease-out cubic for smooth deceleration
            const progress = 1 - Math.pow(1 - rawProgress, 3);

            setAnimatingPiece(prev => prev ? { ...prev, progress } : null);

            if (rawProgress < 1) {
              requestAnimationFrame(animate);
            } else {
              // Animation complete - play sound immediately
              if (soundEnabled) {
                soundSystem.init();
                if (move.to === 'off') {
                  soundSystem.playBearOff();
                } else {
                  soundSystem.playWoodClick();
                }
              }
              
              // Clear main animation
              setAnimatingPiece(null);
              
              // Show landing effect
              setLandingEffect({ x: endX, y: endY });
              setTimeout(() => setLandingEffect(null), 300);
              
              // PARTICLE EFFECTS - Dust puff on landing
              if (particlesEnabled) {
                particleSystem.emitDust(endX, endY, theme);
                
                // Firework burst for bear off!
                if (move.to === 'off') {
                  const playerColor = player === 1 ? colors.player1 : colors.player2;
                  particleSystem.emitFirework(endX, endY, playerColor);
                }
              }
              
              // BEAR OFF COMMENTARY
              if (move.to === 'off') {
                const isPlayer = player === 1;
                // Calculate remaining after this bear off (approximate, will be accurate after state updates)
                const remaining = 15 - (currentBorneOff[player] + 1);
                const bearOffComment = commentarySystem.getBearOffComment(isPlayer, remaining);
                if (bearOffComment) {
                  triggerCommentary(bearOffComment, false, 'good');
                }
              }
              
              // Handle hit animation if needed
              if (isHit) {
                // Play hit sound
                if (soundEnabled) {
                  soundSystem.init();
                  setTimeout(() => soundSystem.playHit(), 50);
                }
                
                // PARTICLE EFFECTS - Sparks on hit!
                if (particlesEnabled) {
                  particleSystem.emitSparks(endX, endY, theme);
                  // Screen shake for dramatic effect
                  setScreenShake(true);
                  setTimeout(() => setScreenShake(false), 200);
                }
                
                // HIT COMMENTARY
                const isPlayerHitting = player === 1;
                const hitComment = commentarySystem.getHitComment(isPlayerHitting, move.to);
                if (hitComment) {
                  triggerCommentary(hitComment, true, 'hit');
                }
                
                // Start hit animation
                setHitAnimation({
                  player: opponent,
                  startX: endX,
                  startY: endY,
                  endX: getBarX(),
                  endY: hitEndY,
                  startTime: performance.now(),
                });
                
                // Wait for hit animation then resolve
                setTimeout(() => {
                  setHitAnimation(null);
                  resolve();
                }, 350);
              } else {
                resolve();
              }
            }
          };

          requestAnimationFrame(animate);
        });
      };

      const rollDiceWithAnimation = () => {
        if (dice.length > 0 || diceRolling) return;
        
        setDiceRolling(true);
        setDiceOnBoard([]); // Clear previous dice
        
        if (soundEnabled) {
          soundSystem.init();
          soundSystem.playDiceRoll();
        }
        
        // Calculate dice landing positions (center bar area)
        const barCenterX = 6 * pointWidth + barWidth / 2;
        const boardCenterY = boardHeight / 2;
        
        // Initial animation - dice falling
        const initialDice = [
          { value: 1, x: barCenterX - 30, y: -60, rotation: Math.random() * 720, settled: false },
          { value: 1, x: barCenterX + 30, y: -80, rotation: Math.random() * 720, settled: false },
        ];
        setDiceOnBoard(initialDice);
        
        // Animate dice falling onto board
        let frame = 0;
        const fallFrames = 20;
        const fallInterval = setInterval(() => {
          frame++;
          const progress = frame / fallFrames;
          const easeOut = 1 - Math.pow(1 - progress, 3);
          
          setDiceOnBoard(prev => prev.map((die, i) => ({
            ...die,
            y: -60 + (i === 0 ? boardCenterY - 35 + 60 : boardCenterY + 35 + 80) * easeOut,
            rotation: die.rotation * (1 - easeOut * 0.8),
            value: Math.floor(Math.random() * 6) + 1, // Spinning values
          })));
          
          if (frame >= fallFrames) {
            clearInterval(fallInterval);
          }
        }, 25);
        
        // Show rolling animation for 600ms
        setTimeout(() => {
          const die1 = Math.floor(Math.random() * 6) + 1;
          const die2 = Math.floor(Math.random() * 6) + 1;
          
          const newDice = die1 === die2 ? [die1, die1, die1, die1] : [die1, die2];
          setDice(newDice);
          setUsedDice([]);
          setTurnDice(newDice);
          setBoardBeforeTurn(cloneBoard(board));
          setBarBeforeTurn({ ...bar });
          setPendingMoves([]);
          setCurrentAnalysis(null);
          setShowHint(false);
          setDiceRolling(false);
          setUndoStack([]); // Clear undo stack for new turn
          
          // Set final dice positions on board
          const finalPositions = die1 === die2 ? [
            { value: die1, x: barCenterX - 35, y: boardCenterY - 35, rotation: Math.random() * 15 - 7.5, settled: true },
            { value: die1, x: barCenterX + 35, y: boardCenterY - 35, rotation: Math.random() * 15 - 7.5, settled: true },
            { value: die1, x: barCenterX - 35, y: boardCenterY + 35, rotation: Math.random() * 15 - 7.5, settled: true },
            { value: die1, x: barCenterX + 35, y: boardCenterY + 35, rotation: Math.random() * 15 - 7.5, settled: true },
          ] : [
            { value: die1, x: barCenterX - 35, y: boardCenterY, rotation: Math.random() * 15 - 7.5, settled: true },
            { value: die2, x: barCenterX + 35, y: boardCenterY, rotation: Math.random() * 15 - 7.5, settled: true },
          ];
          setDiceOnBoard(finalPositions);
          
          // Dice roll commentary
          commentarySystem.moveCount++;
          const isPlayer = currentPlayer === 1;
          const playerName = isPlayer ? 'You' : 'The computer';
          
          // Opening comment for first few moves
          if (commentarySystem.moveCount <= 2 && isPlayer) {
            const openingComment = commentarySystem.getOpeningComment([die1, die2]);
            if (openingComment) {
              triggerCommentary(openingComment);
              return;
            }
          }
          
          const diceComment = commentarySystem.getDiceRollComment([die1, die2], isPlayer, playerName);
          if (diceComment) {
            triggerCommentary(diceComment);
          }
        }, 600);
      };

      const handlePointClick = (pointIndex) => {
        if (gameOver || dice.length === 0 || isAnimating || diceRolling) return;
        if (gameMode === 'ai' && currentPlayer === 2) return;

        if (pointIndex === 'bar') {
          if (bar[currentPlayer] > 0) {
            setSelectedPoint('bar');
          }
          return;
        }

        if (selectedPoint !== null) {
          const move = validMoves.find(m => m.from === selectedPoint && m.to === pointIndex);
          if (move) {
            executePlayerMove(move);
          }
          setSelectedPoint(null);
          return;
        }

        if (bar[currentPlayer] > 0) {
          setSelectedPoint('bar');
        } else if (board[pointIndex]?.player === currentPlayer) {
          setSelectedPoint(pointIndex);
        }
      };

      const handleBearOff = () => {
        if (selectedPoint !== null && !isAnimating) {
          const move = validMoves.find(m => m.from === selectedPoint && m.to === 'off');
          if (move) {
            executePlayerMove(move);
          }
          setSelectedPoint(null);
        }
      };

      const executePlayerMove = async (move) => {
        setIsAnimating(true);
        
        // Save current state for undo before making the move
        setUndoStack(prev => [...prev, {
          board: cloneBoard(board),
          bar: { ...bar },
          borneOff: { ...borneOff },
          usedDice: [...usedDice],
          pendingMoves: [...pendingMoves]
        }]);
        
        await animateMove(move, board, bar, borneOff, currentPlayer);
        
        const result = applyMove(board, bar, borneOff, move, currentPlayer);
        setBoard(result.board);
        setBar(result.bar);
        setBorneOff(result.borneOff);
        setUsedDice([...usedDice, move.dieIndex]);
        setPendingMoves([...pendingMoves, move]);
        
        setIsAnimating(false);
      };

      const undoMove = () => {
        if (undoStack.length === 0 || isAnimating) return;
        
        const prevState = undoStack[undoStack.length - 1];
        setBoard(prevState.board);
        setBar(prevState.bar);
        setBorneOff(prevState.borneOff);
        setUsedDice(prevState.usedDice);
        setPendingMoves(prevState.pendingMoves);
        setUndoStack(prev => prev.slice(0, -1));
        setSelectedPoint(null);
        
        // Play a subtle sound for undo
        if (soundEnabled) {
          soundSystem.playWoodClick(0.3);
        }
      };

      const endTurn = () => {
        if (isAnimating) return;
        
        if (showTutor && currentPlayer === 1 && boardBeforeTurn && pendingMoves.length > 0) {
          const analysis = analyzeMove(boardBeforeTurn, barBeforeTurn, borneOff, 1, turnDice, pendingMoves);
          setCurrentAnalysis(analysis);
          
          // Emit sparkles for good/perfect moves!
          if (particlesEnabled && (analysis.rating === 'Perfect' || analysis.rating === 'Good')) {
            const lastMove = pendingMoves[pendingMoves.length - 1];
            let sparkleX, sparkleY;
            if (lastMove.to === 'off') {
              const homePos = getHomePosition(1);
              sparkleX = homePos.x;
              sparkleY = homePos.y;
            } else {
              sparkleX = getPointX(lastMove.to);
              sparkleY = getCheckerY(lastMove.to, 0, 1);
            }
            particleSystem.emitSparkles(sparkleX, sparkleY, analysis.rating);
          }
          
          // MOVE ANALYSIS COMMENTARY - with specific move details
          const analysisComment = commentarySystem.getMoveAnalysisComment(analysis.rating, analysis.equity, {
            moveExplanations: analysis.moveExplanations,
            improvements: analysis.improvements,
            playerMoves: analysis.playerMoves
          });
          if (analysisComment) {
            // Map rating to category for voice styling
            const ratingToCategory = {
              'Perfect': 'perfect',
              'Good': 'good', 
              'Inaccuracy': 'inaccuracy',
              'Mistake': 'mistake',
              'Blunder': 'blunder'
            };
            const category = ratingToCategory[analysis.rating] || 'neutral';
            setTimeout(() => triggerCommentary(analysisComment, false, category), 300);
          }
          
          setMoveHistory(prev => [...prev, {
            player: 1,
            dice: [...turnDice],
            moves: pendingMoves,
            board: cloneBoard(board),
            analysis
          }]);
        } else {
          setMoveHistory(prev => [...prev, {
            player: currentPlayer,
            dice: [...turnDice],
            moves: pendingMoves,
            board: cloneBoard(board),
            analysis: null
          }]);
        }

        setDice([]);
        setUsedDice([]);
        setPendingMoves([]);
        setSelectedPoint(null);
        setUndoStack([]); // Clear undo stack for new turn
        setDiceOnBoard([]); // Clear dice from board
        setCurrentPlayer(currentPlayer === 1 ? 2 : 1);
      };

      const getHint = () => {
        const bestMoves = getBestMove(board, bar, borneOff, currentPlayer, dice, 3);
        setHintMoves(bestMoves);
        setShowHint(true);
      };

      const newGame = (mode) => {
        setBoard(INITIAL_BOARD());
        setBar({ 1: 0, 2: 0 });
        setBorneOff({ 1: 0, 2: 0 });
        setCurrentPlayer(1);
        setDice([]);
        setUsedDice([]);
        setSelectedPoint(null);
        setValidMoves([]);
        setGameOver(false);
        setWinner(null);
        setMoveHistory([]);
        setCurrentAnalysis(null);
        setShowHint(false);
        setHintMoves([]);
        setPendingMoves([]);
        setBoardBeforeTurn(null);
        setBarBeforeTurn(null);
        setTurnDice([]);
        setUndoStack([]); // Clear undo stack
        setGameMode(mode);
        setShowSettings(false);
        setShowReview(false);
        setAnimatingPiece(null);
        setHitAnimation(null);
        setIsAnimating(false);
        setDiceRolling(false);
        setDiceOnBoard([]); // Clear dice from board
        // Reset particle/celebration states
        setCelebrating(false);
        setScreenShake(false);
        particleSystem.clear();
        // Reset commentary
        setCurrentComment('');
        commentarySystem.reset();
        // Initialize sound on user interaction (game start counts as user action)
        if (soundEnabled) {
          soundSystem.init();
        }
        // Warm up audio context to reduce playback delay
        voiceModule.warmupAudio();
        // Game start commentary (delayed so UI settles)
        setTimeout(() => {
          const playerName = 'You';
          const opponentName = mode === 'ai' ? 'the Computer' : 'Player 2';
          const comment = commentarySystem.getGameStartComment(playerName, opponentName);
          if (comment && commentaryEnabled) {
            commentarySystem.speak(comment, true);
            setCurrentComment(comment);
            setTimeout(() => setCurrentComment(''), 8000);
          }
        }, 500);
      };

      const getPipCount = (player) => {
        let pips = bar[player] * 25;
        for (let i = 0; i < 24; i++) {
          if (board[i].player === player) {
            const distance = player === 1 ? 24 - i : i + 1;
            pips += board[i].count * distance;
          }
        }
        return pips;
      };

      const getMovesForSelected = () => {
        if (selectedPoint === null) return [];
        return validMoves.filter(m => m.from === selectedPoint);
      };

      const selectedMoves = getMovesForSelected();

      const strategicTips = useMemo(() => {
        if (currentPlayer === 1 && showTutor && dice.length > 0) {
          return getStrategicTips(board, bar, borneOff, 1);
        }
        return [];
      }, [board, bar, borneOff, currentPlayer, showTutor, dice]);

      const openingAdvice = useMemo(() => {
        if (moveHistory.length < 4 && dice.length === 2 && showTutor && currentPlayer === 1) {
          return getOpeningAdvice(dice);
        }
        return null;
      }, [dice, moveHistory.length, showTutor, currentPlayer]);

      // Render a 3D checker
      const render3DChecker = (cx, cy, isPlayer1, gradientId, radius = checkerRadius, isLanding = false) => {
        const baseColor = isPlayer1 ? colors.player1 : colors.player2;
        const borderColor = isPlayer1 ? colors.player1Border : colors.player2Border;
        const highlightColor = isPlayer1 ? '#FFFFFF' : '#666666';
        const shadowColor = isPlayer1 ? '#CCCCAA' : '#000000';
        
        return (
          <g style={isLanding ? { animation: 'bounce 0.3s ease-out' } : {}}>
            <defs>
              <radialGradient id={gradientId} cx="35%" cy="35%" r="60%" fx="35%" fy="35%">
                <stop offset="0%" stopColor={highlightColor} stopOpacity="0.9" />
                <stop offset="40%" stopColor={baseColor} stopOpacity="1" />
                <stop offset="100%" stopColor={shadowColor} stopOpacity="1" />
              </radialGradient>
            </defs>
            <ellipse 
              cx={cx + 2} 
              cy={cy + 3} 
              rx={radius} 
              ry={radius * 0.3} 
              fill="rgba(0,0,0,0.3)"
              style={isLanding ? { animation: 'shadowPulse 0.3s ease-out' } : {}}
            />
            <circle cx={cx} cy={cy} r={radius} fill={`url(#${gradientId})`} stroke={borderColor} strokeWidth={1.5} />
            <circle cx={cx} cy={cy} r={radius * 0.75} fill="none" stroke={highlightColor} strokeWidth={1} opacity={0.3} />
            <circle cx={cx} cy={cy} r={radius * 0.5} fill="none" stroke={borderColor} strokeWidth={1} opacity={0.5} />
          </g>
        );
      };

      // Render animating piece with arc path
      // Simple smooth checker animation
      const renderAnimatingPiece = () => {
        if (!animatingPiece) return null;
        
        const { player, startX, startY, endX, endY, progress } = animatingPiece;
        
        // Simple linear interpolation with a gentle arc
        const cx = startX + (endX - startX) * progress;
        
        // Add a subtle arc - highest at middle of animation
        const arcHeight = 30;
        const arc = Math.sin(progress * Math.PI) * arcHeight;
        const cy = startY + (endY - startY) * progress - arc;
        
        return (
          <g>
            {/* Shadow */}
            <ellipse
              cx={cx + 2}
              cy={startY + (endY - startY) * progress + 3}
              rx={checkerRadius}
              ry={checkerRadius * 0.3}
              fill="rgba(0,0,0,0.3)"
            />
            {/* Checker */}
            {render3DChecker(cx, cy, player === 1, 'animating-checker', checkerRadius)}
          </g>
        );
      };

      // Simple hit animation
      const renderHitAnimation = () => {
        if (!hitAnimation) return null;
        
        const { player, startX, startY, endX, endY, startTime } = hitAnimation;
        
        // Calculate progress
        const elapsed = performance.now() - startTime;
        const duration = 300;
        const rawProgress = Math.min(elapsed / duration, 1);
        const progress = 1 - Math.pow(1 - rawProgress, 2); // ease-out quad
        
        // Request update if not done
        if (rawProgress < 1) {
          requestAnimationFrame(() => setHitAnimation(prev => prev ? { ...prev } : null));
        }
        
        // Simple interpolation with higher arc
        const cx = startX + (endX - startX) * progress;
        const arcHeight = 60;
        const arc = Math.sin(progress * Math.PI) * arcHeight;
        const cy = startY + (endY - startY) * progress - arc;
        
        // Spin effect
        const rotation = progress * 360;
        
        return (
          <g transform={`rotate(${rotation}, ${cx}, ${cy})`} opacity={1 - progress * 0.3}>
            {render3DChecker(cx, cy, player === 1, 'hit-checker', checkerRadius * 0.8)}
          </g>
        );
      };

      // Render all particles
      const renderParticles = () => {
        if (!particlesEnabled || particles.length === 0) return null;
        
        return (
          <g className="particles" style={{ pointerEvents: 'none' }}>
            {particles.map((p, i) => {
              const opacity = p.getOpacity();
              const size = p.getSize();
              
              if (p.type === 'circle') {
                return (
                  <circle
                    key={i}
                    cx={p.x}
                    cy={p.y}
                    r={size}
                    fill={p.color}
                    opacity={opacity}
                    style={p.glow ? { filter: `drop-shadow(0 0 ${size}px ${p.color})` } : {}}
                  />
                );
              } else if (p.type === 'spark') {
                // Elongated spark shape
                const angle = Math.atan2(p.vy, p.vx);
                const length = Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 2 + size;
                return (
                  <ellipse
                    key={i}
                    cx={p.x}
                    cy={p.y}
                    rx={length}
                    ry={size * 0.4}
                    fill={p.color}
                    opacity={opacity}
                    transform={`rotate(${angle * 180 / Math.PI}, ${p.x}, ${p.y})`}
                    style={p.glow ? { filter: `drop-shadow(0 0 ${size * 2}px ${p.color})` } : {}}
                  />
                );
              } else if (p.type === 'star') {
                // Simple 4-point star
                const s = size;
                const points = `${p.x},${p.y - s} ${p.x + s * 0.3},${p.y - s * 0.3} ${p.x + s},${p.y} ${p.x + s * 0.3},${p.y + s * 0.3} ${p.x},${p.y + s} ${p.x - s * 0.3},${p.y + s * 0.3} ${p.x - s},${p.y} ${p.x - s * 0.3},${p.y - s * 0.3}`;
                return (
                  <polygon
                    key={i}
                    points={points}
                    fill={p.color}
                    opacity={opacity}
                    transform={`rotate(${p.rotation}, ${p.x}, ${p.y})`}
                    style={p.glow ? { filter: `drop-shadow(0 0 ${size}px ${p.color})` } : {}}
                  />
                );
              } else if (p.type === 'confetti') {
                // Rectangular confetti piece
                const w = size;
                const h = size * 0.6;
                return (
                  <rect
                    key={i}
                    x={p.x - w / 2}
                    y={p.y - h / 2}
                    width={w}
                    height={h}
                    fill={p.color}
                    opacity={opacity}
                    transform={`rotate(${p.rotation}, ${p.x}, ${p.y})`}
                    rx={1}
                  />
                );
              }
              return null;
            })}
          </g>
        );
      };

      const renderPoint = (index) => {
        const isTop = index < 12;
        const x = getPointX(index);
        const point = board[index];
        const isSelected = selectedPoint === index;
        const isValidTarget = selectedMoves.some(m => m.to === index);
        const isHintFrom = showHint && hintMoves.some(m => m.from === index);
        const isHintTo = showHint && hintMoves.some(m => m.to === index);
        
        const isDark = index % 2 === 0;
        
        const trianglePoints = isTop 
          ? `${x},${pointHeight} ${x - pointWidth/2 + 2},${numberSpace} ${x + pointWidth/2 - 2},${numberSpace}`
          : `${x},${boardHeight - pointHeight} ${x - pointWidth/2 + 2},${boardHeight - numberSpace} ${x + pointWidth/2 - 2},${boardHeight - numberSpace}`;

        const shadowOffset = 2;
        const highlightTriangle = isTop 
          ? `${x},${pointHeight - shadowOffset} ${x - pointWidth/2 + 4},${numberSpace} ${x + pointWidth/2 - 4},${numberSpace}`
          : `${x},${boardHeight - pointHeight + shadowOffset} ${x - pointWidth/2 + 4},${boardHeight - numberSpace} ${x + pointWidth/2 - 4},${boardHeight - numberSpace}`;

        const pointGradientId = `point-grad-${index}`;
        const baseColor = isDark ? colors.darkPoint : colors.lightPoint;
        
        const lighterColor = isDark 
          ? (theme === 'classic' ? '#8B5A3A' : '#1a4a7a')
          : (theme === 'classic' ? '#E8C8A8' : '#ff6a7a');
        const darkerColor = isDark 
          ? (theme === 'classic' ? '#4A2A13' : '#082040')
          : (theme === 'classic' ? '#B89060' : '#c93050');

        const checkerElements = [];
        if (point.count > 0) {
          const maxVisible = 5;
          const displayCount = Math.min(point.count, maxVisible);
          
          for (let i = 0; i < displayCount; i++) {
            // Skip rendering if this is the piece being animated FROM this point
            if (animatingPiece && animatingPiece.startX === x && selectedPoint === index && i === displayCount - 1) {
              continue;
            }
            
            const cy = getCheckerY(index, i, point.count);
            const isLandingHere = landingEffect && Math.abs(landingEffect.x - x) < 5 && Math.abs(landingEffect.y - cy) < 20 && i === displayCount - 1;
            
            checkerElements.push(
              <g key={`${index}-${i}`} style={isLandingHere ? { animation: 'bounce 0.3s ease-out' } : {}}>

              return (

                  key={i} 
                  transform={`translate(${die.x - dieSize/2}, ${die.y - dieSize/2}) rotate(${die.rotation}, ${dieSize/2}, ${dieSize/2})`}

                    transition: die.settled ? 'all 0.15s ease-out' : 'none',

                  <rect 
                    x={0} y={0} 
                    width={dieSize} height={dieSize} 
                    rx={6} ry={6}
                    fill={faceColor}
                    stroke={borderColor}
                    strokeWidth={theme === 'modern' ? 2 : 1}
                  />

                    x={2} y={2} 
                    width={dieSize - 4} height={dieSize/3} 
                    rx={4} ry={4}
                    fill="rgba(255,255,255,0.15)"
                  />

                  {dotPositions[die.value]?.map(([dx, dy], j) => (
                    <circle

                      cx={dieSize * dx / 100}
                      cy={dieSize * dy / 100}
                      r={dotSize / 2}
                      fill={dotColor}

            puzzleMoves.every((m, i) => m.from === currentDrill.correct[i][0] && m.to === currentDrill.correct[i][1]);

                          cy={isTop ? 30 + j * 22 : 290 - j * 22}
                          r="10"
                          fill={point.player === 1 ? colors.player1 : colors.player2}
                          stroke={point.player === 1 ? colors.player1Accent : colors.player2Accent}
                          strokeWidth="2"
                          style={{ cursor: point.player === 1 ? 'pointer' : 'default' }}
                        />
                      ));
                    })}
                    
                    {/* Dice display */}
                    <text x="250" y="165" textAnchor="middle" fill={colors.textColor} fontSize="18" fontWeight="bold">
                      🎲 {dice.filter((_, i) => !usedDice.includes(i)).join(' - ')}
                    </text>
                  </svg>
                  
                  <div style={{ color: colors.textColor, fontSize: '12px', textAlign: 'center', marginTop: '10px', opacity: 0.7 }}>
                    Click your checkers to move them
                  </div>
                </div>
                <button
                  onClick={checkDrillAnswer}
                  disabled={puzzleMoves.length === 0}
                  style={{
                    padding: '12px 30px',
                    background: colors.buttonBg,
                    color: colors.buttonText,
                    border: 'none',
                    borderRadius: '6px',
                    cursor: puzzleMoves.length > 0 ? 'pointer' : 'not-allowed',
                    opacity: puzzleMoves.length > 0 ? 1 : 0.5,
                  }}
                >
                  Submit Answer
                </button>
              </>
            ) : drillResult && (
              <div style={{
                background: drillResult.correct ? 'rgba(76,175,80,0.2)' : 'rgba(244,67,54,0.2)',
                padding: '25px',
                borderRadius: '12px',
                maxWidth: '400px',
                width: '100%',
                textAlign: 'center',
              }}>
                <div style={{ fontSize: '28px', marginBottom: '10px' }}>
                  {drillResult.correct ? '✅ Correct!' : '❌ Try Again'}
                </div>
                <div style={{ color: colors.textColor, fontSize: '16px', marginBottom: '10px' }}>
                  Time: {drillResult.time.toFixed(1)}s
                  {drillResult.correct && drillResult.timeBonus && (
                    <span style={{ color: '#4CAF50', marginLeft: '10px' }}>⚡ Speed Bonus!</span>
                  )}
                </div>
                {!drillResult.correct && (
                  <div style={{ color: colors.textColor, fontSize: '13px', marginBottom: '15px' }}>
                    Correct: {currentDrill.correct.map(m => `${m[0]+1}→${m[1]+1}`).join(', ')}
                  </div>
                )}
                <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginTop: '15px' }}>
                  <button
                    onClick={() => { setDrillResult(null); startDrill(); }}
                    style={{
                      padding: '10px 20px',
                      background: 'transparent',
                      color: colors.textColor,
                      border: `1px solid ${colors.accentColor}`,
                      borderRadius: '6px',
                      cursor: 'pointer',
                    }}
                  >
                    Retry
                  </button>
                  {drillResult.correct && openingDrillIndex < OPENING_DRILLS.length - 1 && (
                    <button
                      onClick={() => { setOpeningDrillIndex(i => i + 1); setDrillResult(null); }}
                      style={{
                        padding: '10px 20px',
                        background: colors.buttonBg,
                        color: colors.buttonText,
                        border: 'none',
                        borderRadius: '6px',
                        cursor: 'pointer',
                      }}
                    >
                      Next Drill →
                    </button>
                  )}
                </div>
              </div>
            )}
            
            {/* Drill selector */}
            <div style={{ marginTop: '30px', maxWidth: '600px', width: '100%' }}>
              <h4 style={{ color: colors.textColor, marginBottom: '10px' }}>All Openings:</h4>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                {OPENING_DRILLS.map((drill, i) => (
                  <button
                    key={i}
                    onClick={() => { setOpeningDrillIndex(i); setDrillResult(null); setDrillRunning(false); }}
                    style={{
                      padding: '6px 12px',
                      background: i === openingDrillIndex ? colors.accentColor : 
                                  progress.openingDrillsCompleted > i ? 'rgba(76,175,80,0.3)' : 'transparent',
                      color: i === openingDrillIndex ? colors.buttonText : colors.textColor,
                      border: `1px solid ${colors.accentColor}60`,
                      borderRadius: '4px',
                      cursor: 'pointer',
                      fontSize: '12px',
                    }}
                  >
                    {drill.dice.join('-')} {progress.openingDrillsCompleted > i ? '✓' : ''}
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }
      
      // ============================================================================
      // FAMOUS GAMES REPLAY MODE
      // ============================================================================
      if (appMode === 'replay') {
        return (
          <div style={{
            minHeight: '100vh',
            background: colors.boardBg,
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            padding: '20px',
            fontFamily: theme === 'classic' ? 'Georgia, serif' : '-apple-system, sans-serif',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', maxWidth: '700px', marginBottom: '20px' }}>
              <button
                onClick={() => { setAppMode('menu'); setReplayGame(null); }}
                style={{
                  padding: '8px 16px',
                  background: 'transparent',
                  color: colors.textColor,
                  border: `1px solid ${colors.accentColor}`,
                  borderRadius: '6px',
                  cursor: 'pointer',
                }}
              >
                ← Back
              </button>
              <h2 style={{ color: colors.accentColor, margin: 0 }}>🏆 Famous Games</h2>
              <div />
            </div>
            
            {!replayGame ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '15px', maxWidth: '600px', width: '100%' }}>
                {FAMOUS_GAMES.map(game => (
                  <div
                    key={game.id}
                    onClick={() => { setReplayGame(game); setReplayPosition(0); }}
                    style={{
                      background: colors.panelBg,
                      padding: '20px',
                      borderRadius: '12px',
                      cursor: 'pointer',
                      border: `2px solid transparent`,
                      transition: 'border-color 0.2s',
                    }}
                    onMouseEnter={e => e.currentTarget.style.borderColor = colors.accentColor}
                    onMouseLeave={e => e.currentTarget.style.borderColor = 'transparent'}
                  >
                    <h3 style={{ color: colors.accentColor, margin: '0 0 8px 0' }}>{game.title}</h3>
                    <div style={{ color: colors.textColor, fontSize: '14px', marginBottom: '5px' }}>
                      {game.players} ({game.year})
                    </div>
                    <div style={{ color: colors.textColor, fontSize: '13px', opacity: 0.8 }}>
                      {game.description}
                    </div>
                    <div style={{ color: colors.accentColor, fontSize: '12px', marginTop: '10px' }}>
                      {game.positions.length} annotated positions →
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <>
                <div style={{
                  background: colors.panelBg,
                  padding: '15px',
                  borderRadius: '12px',
                  maxWidth: '700px',
                  width: '100%',
                  marginBottom: '15px',
                }}>
                  <h3 style={{ color: colors.accentColor, margin: '0 0 10px 0' }}>{replayGame.title}</h3>
                  <div style={{ color: colors.textColor, fontSize: '13px', marginBottom: '15px' }}>
                    {replayGame.players} ({replayGame.year})
                  </div>
                  
                  <div style={{ color: colors.textColor, fontSize: '14px', marginBottom: '10px' }}>
                    <strong>Position {replayPosition + 1}:</strong> {replayGame.positions[replayPosition].annotation}
                  </div>
                  <div style={{ color: colors.accentColor, fontSize: '13px' }}>
                    Roll: {replayGame.positions[replayPosition].dice.join('-')} | 
                    Played: {replayGame.positions[replayPosition].played.map(m => `${m[0]+1}→${m[1]+1}`).join(', ')}
                  </div>
                </div>
                
                {/* Board preview */}
                <div style={{
                  background: colors.panelBg,
                  padding: '15px',
                  borderRadius: '12px',
                  marginBottom: '15px',
                }}>
                  {(() => {
                    const pos = replayGame.positions[replayPosition];
                    const posBoard = pos.board;
                    const posBar = pos.bar || { 1: 0, 2: 0 };
                    const posBorneOff = pos.borneOff || { 1: 0, 2: 0 };
                    return (
                      <svg 
                        width={Math.min(500, windowSize.width - 60)} 
                        height={Math.min(320, (windowSize.width - 60) * 0.65)}
                        viewBox="0 0 500 320"
                        style={{ display: 'block', margin: '0 auto' }}
                      >
                        {/* Board background */}
                        <rect x="0" y="0" width="500" height="320" fill={colors.boardBg} rx="8" />
                        <rect x="10" y="10" width="480" height="300" fill={colors.pointDark} rx="4" />
                        
                        {/* Bar */}
                        <rect x="240" y="10" width="20" height="300" fill={colors.barColor} />
                        
                        {/* Points - simplified triangles */}
                        {Array.from({ length: 24 }).map((_, i) => {
                          const isTop = i < 12;
                          const col = isTop ? 11 - i : i - 12;
                          const x = col < 6 ? 15 + col * 37 : 265 + (col - 6) * 37;
                          const pointColor = i % 2 === 0 ? colors.pointLight : colors.pointDark;
                          return (
                            <polygon
                              key={i}
                              points={isTop 
                                ? `${x},15 ${x + 35},15 ${x + 17.5},130`
                                : `${x},305 ${x + 35},305 ${x + 17.5},190`}
                              fill={pointColor}
                              stroke={colors.boardBg}
                              strokeWidth="1"
                            />
                          );
                        })}
                        
                        {/* Checkers on points */}
                        {posBoard.map((point, i) => {
                          if (point.count === 0) return null;
                          const isTop = i < 12;
                          const col = isTop ? 11 - i : i - 12;
                          const x = col < 6 ? 15 + col * 37 + 17.5 : 265 + (col - 6) * 37 + 17.5;
                          return Array.from({ length: Math.min(point.count, 5) }).map((_, j) => (
                            <g key={`${i}-${j}`}>
                              <circle
                                cx={x}
                                cy={isTop ? 30 + j * 22 : 290 - j * 22}
                                r="10"
                                fill={point.player === 1 ? colors.player1 : colors.player2}
                                stroke={point.player === 1 ? colors.player1Accent : colors.player2Accent}
                                strokeWidth="2"
                              />
                              {/* Show count if more than 5 */}
                              {j === 4 && point.count > 5 && (
                                <text 
                                  x={x} 
                                  y={isTop ? 30 + j * 22 + 4 : 290 - j * 22 + 4} 
                                  textAnchor="middle" 
                                  fill="#fff" 
                                  fontSize="10"
                                  fontWeight="bold"
                                >
                                  {point.count}
                                </text>
                              )}
                            </g>
                          ));
                        })}
                        
                        {/* Bar checkers */}
                        {posBar[1] > 0 && Array.from({ length: Math.min(posBar[1], 3) }).map((_, j) => (
                          <circle
                            key={`bar1-${j}`}
                            cx={250}
                            cy={160 + j * 22}
                            r="10"
                            fill={colors.player1}
                            stroke={colors.player1Accent}
                            strokeWidth="2"
                          />
                        ))}
                        {posBar[2] > 0 && Array.from({ length: Math.min(posBar[2], 3) }).map((_, j) => (
                          <circle
                            key={`bar2-${j}`}
                            cx={250}
                            cy={140 - j * 22}
                            r="10"
                            fill={colors.player2}
                            stroke={colors.player2Accent}
                            strokeWidth="2"
                          />
                        ))}
                        
                        {/* Dice display */}
                        {pos.dice && (
                          <text x="250" y="165" textAnchor="middle" fill={colors.textColor} fontSize="16" fontWeight="bold">
                            🎲 {pos.dice[0]}-{pos.dice[1]}
                          </text>
                        )}
                        
                        {/* Borne off indicators */}
                        {posBorneOff[1] > 0 && (
                          <g>
                            <rect x="475" y="280" width="20" height="25" rx="3" fill={colors.player1} opacity="0.8" />
                            <text x="485" y="297" textAnchor="middle" fill="#fff" fontSize="11" fontWeight="bold">{posBorneOff[1]}</text>
                          </g>
                        )}
                        {posBorneOff[2] > 0 && (
                          <g>
                            <rect x="475" y="15" width="20" height="25" rx="3" fill={colors.player2} opacity="0.8" />
                            <text x="485" y="32" textAnchor="middle" fill="#fff" fontSize="11" fontWeight="bold">{posBorneOff[2]}</text>
                          </g>
                        )}
                      </svg>
                    );
                  })()}
                </div>
                
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button
                    onClick={() => setReplayPosition(p => Math.max(0, p - 1))}
                    disabled={replayPosition === 0}
                    style={{
                      padding: '10px 20px',
                      background: 'transparent',
                      color: colors.textColor,
                      border: `1px solid ${colors.accentColor}`,
                      borderRadius: '6px',
                      cursor: replayPosition > 0 ? 'pointer' : 'not-allowed',
                      opacity: replayPosition > 0 ? 1 : 0.5,
                    }}
                  >
                    ← Previous
                  </button>
                  <button
                    onClick={() => setReplayPosition(p => Math.min(replayGame.positions.length - 1, p + 1))}
                    disabled={replayPosition >= replayGame.positions.length - 1}
                    style={{
                      padding: '10px 20px',
                      background: colors.buttonBg,
                      color: colors.buttonText,
                      border: 'none',
                      borderRadius: '6px',
                      cursor: replayPosition < replayGame.positions.length - 1 ? 'pointer' : 'not-allowed',
                      opacity: replayPosition < replayGame.positions.length - 1 ? 1 : 0.5,
                    }}
                  >
                    Next →
                  </button>
                </div>
                
                <button
                  onClick={() => setReplayGame(null)}
                  style={{
                    marginTop: '20px',
                    padding: '8px 16px',
                    background: 'transparent',
                    color: colors.textColor,
                    border: `1px solid ${colors.accentColor}60`,
                    borderRadius: '6px',
                    cursor: 'pointer',
                    fontSize: '13px',
                  }}
                >
                  ← Back to Game List
                </button>
              </>
            )}
          </div>
        );
      }
      
      // ============================================================================
      // PROGRESS DASHBOARD
      // ============================================================================
      if (appMode === 'dashboard') {
        const weaknesses = getWeaknessAnalysis(progress);
        const winRate = progress.gamesPlayed > 0 ? ((progress.gamesWon / progress.gamesPlayed) * 100).toFixed(0) : 0;
        const avgAccuracy = progress.accuracyHistory.length > 0 
          ? (progress.accuracyHistory.reduce((a, b) => a + b, 0) / progress.accuracyHistory.length).toFixed(0)
          : 0;
        const earnedAchievements = ACHIEVEMENTS.filter(a => a.condition(progress));
        
        return (
          <div style={{
            minHeight: '100vh',
            background: colors.boardBg,
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            padding: '20px',
            fontFamily: theme === 'classic' ? 'Georgia, serif' : '-apple-system, sans-serif',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', maxWidth: '700px', marginBottom: '20px' }}>
              <button
                onClick={() => setAppMode('menu')}
                style={{
                  padding: '8px 16px',
                  background: 'transparent',
                  color: colors.textColor,
                  border: `1px solid ${colors.accentColor}`,
                  borderRadius: '6px',
                  cursor: 'pointer',
                }}
              >
                ← Back
              </button>
              <h2 style={{ color: colors.accentColor, margin: 0 }}>📊 Progress Dashboard</h2>
              <div />
            </div>
            
            {/* Main Stats Grid */}
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
              gap: '15px',
              maxWidth: '700px',
              width: '100%',
              marginBottom: '20px',
            }}>
              <div style={{ background: colors.panelBg, padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                <div style={{ fontSize: '32px', color: colors.accentColor, fontWeight: 'bold' }}>{progress.gamesPlayed}</div>
                <div style={{ color: colors.textColor, fontSize: '13px' }}>Games Played</div>
              </div>
              <div style={{ background: colors.panelBg, padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                <div style={{ fontSize: '32px', color: '#4CAF50', fontWeight: 'bold' }}>{winRate}%</div>
                <div style={{ color: colors.textColor, fontSize: '13px' }}>Win Rate</div>
              </div>
              <div style={{ background: colors.panelBg, padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                <div style={{ fontSize: '32px', color: '#FF9800', fontWeight: 'bold' }}>{progress.puzzleElo}</div>
                <div style={{ color: colors.textColor, fontSize: '13px' }}>Puzzle Elo</div>
              </div>
              <div style={{ background: colors.panelBg, padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                <div style={{ fontSize: '32px', color: '#2196F3', fontWeight: 'bold' }}>{avgAccuracy}%</div>
                <div style={{ color: colors.textColor, fontSize: '13px' }}>Avg Accuracy</div>
              </div>
            </div>
            
            {/* Accuracy Chart */}
            {progress.accuracyHistory.length > 0 && (
              <div style={{
                background: colors.panelBg,
                padding: '20px',
                borderRadius: '12px',
                maxWidth: '700px',
                width: '100%',
                marginBottom: '20px',
              }}>
                <h3 style={{ color: colors.accentColor, marginBottom: '15px', fontSize: '16px' }}>📈 Accuracy Trend</h3>
                <div style={{ display: 'flex', alignItems: 'end', height: '100px', gap: '4px' }}>
                  {progress.accuracyHistory.slice(-20).map((acc, i) => (
                    <div
                      key={i}
                      style={{
                        flex: 1,
                        height: `${acc}%`,
                        background: acc >= 80 ? '#4CAF50' : acc >= 60 ? '#FF9800' : '#f44336',
                        borderRadius: '2px 2px 0 0',
                        minWidth: '10px',
                      }}
                      title={`Game ${i + 1}: ${acc}%`}
                    />
                  ))}
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '5px', fontSize: '11px', color: colors.textColor + '80' }}>
                  <span>Older</span>
                  <span>Recent</span>
                </div>
              </div>
            )}
            
            {/* Move Breakdown */}
            <div style={{
              background: colors.panelBg,
              padding: '20px',
              borderRadius: '12px',
              maxWidth: '700px',
              width: '100%',
              marginBottom: '20px',
            }}>
              <h3 style={{ color: colors.accentColor, marginBottom: '15px', fontSize: '16px' }}>🎯 Move Quality Breakdown</h3>
              <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', justifyContent: 'center' }}>
                {[
                  { key: 'perfect', label: 'Perfect', color: '#4CAF50' },
                  { key: 'good', label: 'Good', color: '#8BC34A' },
                  { key: 'inaccuracy', label: 'Inaccuracy', color: '#FFC107' },
                  { key: 'mistake', label: 'Mistake', color: '#FF9800' },
                  { key: 'blunder', label: 'Blunder', color: '#f44336' },
                ].map(item => (
                  <div key={item.key} style={{ textAlign: 'center', minWidth: '80px' }}>
                    <div style={{ fontSize: '24px', color: item.color, fontWeight: 'bold' }}>
                      {progress.moveBreakdown[item.key] || 0}
                    </div>
                    <div style={{ fontSize: '12px', color: colors.textColor }}>{item.label}</div>
                  </div>
                ))}
              </div>
            </div>
            
            {/* Weaknesses */}
            <div style={{
              background: colors.panelBg,
              padding: '20px',
              borderRadius: '12px',
              maxWidth: '700px',
              width: '100%',
              marginBottom: '20px',
            }}>
              <h3 style={{ color: colors.accentColor, marginBottom: '15px', fontSize: '16px' }}>🔍 Areas for Improvement</h3>
              {weaknesses.map((w, i) => (
                <div key={i} style={{ 
                  padding: '10px', 
                  background: 'rgba(255,255,255,0.05)', 
                  borderRadius: '6px',
                  marginBottom: '8px',
                  color: colors.textColor,
                  fontSize: '14px',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '10px'
                }}>
                  <span>💡</span> {w}
                </div>
              ))}
            </div>
            
            {/* Achievements */}
            <div style={{
              background: colors.panelBg,
              padding: '20px',
              borderRadius: '12px',
              maxWidth: '700px',
              width: '100%',
            }}>
              <h3 style={{ color: colors.accentColor, marginBottom: '15px', fontSize: '16px' }}>🏅 Achievements ({earnedAchievements.length}/{ACHIEVEMENTS.length})</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '10px' }}>
                {ACHIEVEMENTS.map(achievement => {
                  const earned = achievement.condition(progress);
                  return (
                    <div
                      key={achievement.id}
                      style={{
                        padding: '12px',
                        background: earned ? 'rgba(76,175,80,0.2)' : 'rgba(255,255,255,0.05)',
                        borderRadius: '8px',
                        textAlign: 'center',
                        opacity: earned ? 1 : 0.5,
                      }}
                      title={achievement.description}
                    >
                      <div style={{ fontSize: '24px', marginBottom: '5px' }}>{achievement.icon}</div>
                      <div style={{ color: colors.textColor, fontSize: '12px' }}>{achievement.name}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      // Game screen
      return (
        <div 
          onClick={() => {
            // Initialize sound on any click (browser autoplay policy)
            if (soundEnabled && !soundSystem.initialized) {
              soundSystem.init();
            }
          }}
          style={{
          minHeight: '100vh',
          background: colors.boardBg,
          padding: isMobile ? '10px' : '20px',
          fontFamily: theme === 'classic' ? 'Georgia, serif' : '-apple-system, BlinkMacSystemFont, sans-serif',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
        }}>
          {/* Header */}
          <div style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            width: '100%',
            maxWidth: totalBoardWidth,
            marginBottom: '10px',
          }}>
            <button
              onClick={() => setGameMode(null)}
              style={{
                padding: '8px 16px',
                background: 'transparent',
                color: colors.textColor,
                border: `1px solid ${colors.textColor}50`,
                borderRadius: '4px',
                cursor: 'pointer',
                fontSize: '14px',
              }}
            >
              ← Menu
            </button>
            
            <div style={{ display: 'flex', gap: '10px' }}>
              <button
                onClick={() => setShowSettings(!showSettings)}
                style={{
                  padding: '8px 16px',
                  background: 'transparent',
                  color: colors.textColor,
                  border: `1px solid ${colors.textColor}50`,
                  borderRadius: '4px',
                  cursor: 'pointer',
                  fontSize: '14px',
                }}
              >
                ⚙️
              </button>
              {gameOver && (
                <button
                  onClick={() => setShowReview(true)}
                  style={{
                    padding: '8px 16px',
                    background: colors.accentColor,
                    color: colors.buttonText,
                    border: 'none',
                    borderRadius: '4px',
                    cursor: 'pointer',
                    fontSize: '14px',
                  }}
                >
                  Review Game
                </button>
              )}
            </div>
          </div>

          {/* Settings Modal */}
          {showSettings && (
            <div style={{
              position: 'fixed',
              top: 0,
              left: 0,
              right: 0,
              bottom: 0,
              background: 'rgba(0,0,0,0.8)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              zIndex: 1000,
            }} onClick={() => setShowSettings(false)}>
              <div style={{

                      <div>
                        <div style={{ color: '#FFC107', fontSize: '18px', fontWeight: 'bold' }}>{inaccuracies}</div>
                        <div style={{ color: colors.textColor, fontSize: '10px' }}>Inaccuracy</div>
                      </div>
                      <div>
                        <div style={{ color: '#FF9800', fontSize: '18px', fontWeight: 'bold' }}>{mistakes}</div>
                        <div style={{ color: colors.textColor, fontSize: '10px' }}>Mistake</div>
                      </div>
                      <div>
                        <div style={{ color: '#f44336', fontSize: '18px', fontWeight: 'bold' }}>{blunders}</div>
                        <div style={{ color: colors.textColor, fontSize: '10px' }}>Blunder</div>
                      </div>
                    </div>
                    
                    {/* Skill Assessment */}
                    <div style={{
                      marginTop: '15px',
                      padding: '10px',
                      background: 'rgba(255,255,255,0.05)',
                      borderRadius: '6px',
                    }}>
                      <div style={{ color: colors.textColor, fontSize: '13px' }}>
                        {accuracy >= 90 ? '🌟 Expert Level! Your play was nearly optimal. Keep it up!' :
                         accuracy >= 75 ? '📈 Advanced Player! You\'re making strong decisions. Focus on eliminating those last mistakes.' :
                         accuracy >= 60 ? '📚 Intermediate Player! Good fundamentals. Review your mistakes to improve.' :
                         accuracy >= 40 ? '🌱 Learning Player! Keep practicing opening theory and basic tactics.' :
                         '📖 Beginner! Use the Lessons tab to learn key concepts. Every game is a learning opportunity!'}
                      </div>
                    </div>
                  </div>
                );
              })()}
              
              {/* Learning Tips */}
              <div style={{
                background: 'rgba(255,193,7,0.15)',
                padding: '12px',
                borderRadius: '8px',
              }}>
                <div style={{ color: '#FFC107', fontWeight: 'bold', fontSize: '13px', marginBottom: '8px' }}>
                  💡 Tips for Improvement
                </div>
                <div style={{ color: colors.textColor, fontSize: '12px', lineHeight: 1.6 }}>
                  {(() => {
                    const playerMoves = moveHistory.filter(m => m.player === 1 && m.analysis);
                    const blunders = playerMoves.filter(m => m.analysis?.rating === 'Blunder');
                    const mistakes = playerMoves.filter(m => m.analysis?.rating === 'Mistake');
                    
                    if (blunders.length > 0) {
                      return '• You had some blunders. Click "Review Game" to see what went wrong and learn the better plays.';
                    } else if (mistakes.length > 2) {
                      return '• Focus on reducing mistakes by considering all your options before moving. Ask yourself: "Am I leaving blots? Am I making points?"';
                    } else if (mistakes.length > 0) {
                      return '• Good game! A few small improvements will make you much stronger. Review your mistakes to spot patterns.';
                    } else {
                      return '• Excellent play! Keep challenging yourself against harder opponents.';
                    }
                  })()}
                </div>
                <div style={{ color: colors.textColor, fontSize: '12px', marginTop: '8px' }}>
                  • Click "Review Game" above to see a move-by-move analysis
                </div>
                <div style={{ color: colors.textColor, fontSize: '12px', marginTop: '4px' }}>
                  • Check the Lessons tab during games to learn key concepts
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BackgammonApp />);
  </script>
  
  <!-- Service Worker Registration (only when hosted with sw.js) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Only register if we're on a proper hosting environment
        if (location.protocol === 'https:' || location.hostname === 'localhost') {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(() => {}); // Silently fail if sw.js not found
        }
      });
    }
  </script>
</body>
</html>
